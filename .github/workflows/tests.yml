name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs: lets a maintainer start a run and cancel it on purpose, which
  # is how the cancelled-run artifact behaviour gets checked.
  workflow_dispatch:

# A newer push to the same ref supersedes the older run instead of leaving two
# full Qt runs racing; the cancelled one is visible in the run list.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pinned, not ubuntu-latest: the apt package names below were validated
    # against 24.04 (noble), and ubuntu-latest moves to Ubuntu 26 from
    # 2026-10-19. Bump this deliberately with the package list.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # checkout/setup-python majors that run on Node 24; the older node20
      # releases are deprecated and produce a warning annotation.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libglvnd0 \
            libfreetype6 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            dbus fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile modules
        run: |
          python -m py_compile synced_lyrics.py koneko_lyrics.py lyrics.py \
            mpris.py playback.py test_lyrics.py test_ui_smoke.py

      # Parser/decoder suite. The test_live_* checks call real provider APIs,
      # so they are switched off: a provider outage or rate limit must not
      # turn into a flaky red build.
      - name: Lyrics parser suite (live network checks off)
        env:
          LYRICS_LIVE_TESTS: "0"
        run: |
          set -o pipefail
          python test_lyrics.py 2>&1 | tee "$RUNNER_TEMP/lyrics.log"

      # The suite's exit code is the assertion: it must exit 0. The app is
      # shown offscreen with no player, network or tray involved. Exit 0
      # alone is not enough, though: the MPRIS Seeked test prints SKIP
      # instead of OK when the session bus is unavailable, so a shrunken run
      # would still look green. Assert that nothing skipped, that the MPRIS
      # check actually ran, and that the suite reached its final line.
      - name: UI smoke suite (offscreen)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/smoke.log"
          dbus-run-session -- python test_ui_smoke.py 2>&1 | tee "$log"
          echo "checks passed: $(grep -c ': OK' "$log" || true)"
          # No fixed total: any skip fails the job, so adding a check later
          # needs no CI edit, while a quietly skipped one can never pass.
          if grep -nE ': SKIP|^SKIP ' "$log"; then
            echo "::error::a smoke check was skipped; CI must run every check"
            exit 1
          fi
          if ! grep -q 'MPRIS Seeked subscription: OK' "$log"; then
            echo "::error::MPRIS Seeked subscription check did not run"
            exit 1
          fi
          # Last line after every test: proves the run reached the end.
          if ! grep -qx 'test_ui_smoke: OK — all checks passed' "$log"; then
            echo "::error::suite did not reach its final OK line"
            exit 1
          fi

      # A short summary on the run page, plus ::notice:: annotations so the
      # same facts also show up in the annotations area (one signed-out view
      # here showed an empty summary panel but working annotations; not a
      # documented rule, hence both).
      - name: Write run summary
        if: always()
        run: |
          lyr="$RUNNER_TEMP/lyrics.log"; smk="$RUNNER_TEMP/smoke.log"
          row() { printf '| %s | %s | %s | %s | %s |\n' "$1" "$2" "$3" "$4" "$5"; }
          if [ -f "$lyr" ]; then
            counts=$(grep -oE '[0-9]+ passed, [0-9]+ skipped, [0-9]+ failed' "$lyr" | tail -1)
            set -- ${counts:-? passed, ? skipped, ? failed}
            lrow=("lyrics" "$1" "$3" "$5" "$(tail -n1 "$lyr" | tr '|' '/')")
          else
            lrow=("lyrics" "—" "—" "—" "no output")
          fi
          if [ -f "$smk" ]; then
            ok=$(grep -c ': OK' "$smk" || true); sk=$(grep -cE ': SKIP|^SKIP ' "$smk" || true)
            if grep -qx 'test_ui_smoke: OK — all checks passed' "$smk"; then
              srow=("ui smoke" "$ok" "$sk" 0 "test_ui_smoke: OK — all checks passed")
            else
              srow=("ui smoke" "$ok" "$sk" 1 "(did not finish)")
            fi
          else
            srow=("ui smoke" "—" "—" "—" "no output")
          fi
          {
            echo "## Suites"; echo
            echo "| suite | passed | skipped | failed | final line |"
            echo "|---|---|---|---|---|"
            row "${lrow[@]}"; row "${srow[@]}"; echo
            echo "### Failures and skips"; echo
            found=0
            if [ -f "$lyr" ] && grep -qE '^(FAIL|ERROR) ' "$lyr"; then
              grep -E '^(FAIL|ERROR) ' "$lyr" | head -5 | sed 's/^/- lyrics: /'; found=1
            fi
            if [ -f "$lyr" ] && grep -q '^SKIP ' "$lyr"; then
              echo "- lyrics skipped $(grep -c '^SKIP ' "$lyr") (the test_live_* network checks are off in CI)"; found=1
            fi
            if [ -f "$smk" ] && ! grep -qx 'test_ui_smoke: OK — all checks passed' "$smk"; then
              echo "- ui smoke stopped early: $(tail -n1 "$smk")"; found=1
            fi
            [ "$found" = 0 ] && echo "- none"
          } >> "$GITHUB_STEP_SUMMARY"
          # Public copy: annotations render when signed out, the summary panel does not.
          echo "::notice::suites — lyrics ${lrow[1]} passed / ${lrow[2]} skipped / ${lrow[3]} failed; ui smoke ${srow[1]} passed / ${srow[2]} skipped / ${srow[3]} failed"
          [ -f "$lyr" ] && grep -hE '^(FAIL|ERROR) ' "$lyr" | head -3 | sed 's/^/::error::lyrics /'
          [ -f "$smk" ] && ! grep -qx 'test_ui_smoke: OK — all checks passed' "$smk" && \
            echo "::error::ui smoke stopped before the end: $(tail -n1 "$smk")"
          [ -s "$GITHUB_STEP_SUMMARY" ] || echo "::warning::CI summary file is empty"

      # Both suites tee their output to $RUNNER_TEMP. Upload those files
      # unconditionally: a run cut short by the concurrency group still
      # leaves its partial logs behind, for details the summary leaves out.
      - name: Upload suite logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: suite-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lyrics.log
            ${{ runner.temp }}/smoke.log
          if-no-files-found: warn
          retention-days: 7
