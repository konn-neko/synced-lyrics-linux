name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libglvnd0 \
            libfreetype6 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            dbus fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile modules
        run: |
          python -m py_compile synced_lyrics.py koneko_lyrics.py lyrics.py \
            mpris.py playback.py test_lyrics.py test_ui_smoke.py

      # The suite's exit code is the assertion: it must exit 0. The app is
      # shown offscreen with no player, network or tray involved; the MPRIS
      # Seeked test skips itself when the session bus is unavailable.
      - name: UI smoke suite (offscreen)
        run: dbus-run-session -- python test_ui_smoke.py
