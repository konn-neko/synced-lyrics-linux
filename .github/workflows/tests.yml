name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the older run instead of leaving two
# full Qt runs racing; the cancelled one is visible in the run list.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Pinned, not ubuntu-latest: the apt package names below were validated
    # against 24.04 (noble), and ubuntu-latest moves to Ubuntu 26 from
    # 2026-10-19. Bump this deliberately with the package list.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # checkout/setup-python majors that run on Node 24; the older node20
      # releases are deprecated and produce a warning annotation.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libglvnd0 \
            libfreetype6 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            dbus fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile modules
        run: |
          python -m py_compile synced_lyrics.py koneko_lyrics.py lyrics.py \
            mpris.py playback.py test_lyrics.py test_ui_smoke.py

      # Parser/decoder suite. The test_live_* checks call real provider APIs,
      # so they are switched off: a provider outage or rate limit must not
      # turn into a flaky red build.
      - name: Lyrics parser suite (live network checks off)
        env:
          LYRICS_LIVE_TESTS: "0"
        run: python test_lyrics.py

      # The suite's exit code is the assertion: it must exit 0. The app is
      # shown offscreen with no player, network or tray involved. Exit 0
      # alone is not enough, though: the MPRIS Seeked test prints SKIP
      # instead of OK when the session bus is unavailable, so a shrunken run
      # would still look green. Assert the suite's own check count and that
      # the MPRIS check actually ran.
      - name: UI smoke suite (offscreen)
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/smoke.log"
          dbus-run-session -- python test_ui_smoke.py | tee "$log"
          checks=$(grep -c ': OK' "$log" || true)
          echo "checks passed: $checks"
          if [ "$checks" -lt 30 ]; then
            echo "::error::only $checks of the 30 smoke checks passed"
            exit 1
          fi
          if ! grep -q 'MPRIS Seeked subscription: OK' "$log"; then
            echo "::error::MPRIS Seeked subscription check was skipped or did not pass"
            exit 1
          fi
